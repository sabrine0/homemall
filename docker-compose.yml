version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: homemall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homemall
    ports:
      - "5432:5432"
    volumes:
      - homemall_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: homemall-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/homemall?schema=public
      JWT_SECRET: super-secret-change-me
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_NAME: homemall_token
      SEED_DEMO_ZONES: ${SEED_DEMO_ZONES:-true}
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_SERVER_URL: http://api:4000
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        COOKIE_NAME: homemall_token
    container_name: homemall-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_SERVER_URL: http://api:4000
      COOKIE_NAME: homemall_token
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  homemall_pgdata:
