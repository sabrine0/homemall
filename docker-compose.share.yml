services:
  postgres:
    image: postgres:16-alpine
    container_name: homemall-postgres-share
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-homemall}
    volumes:
      - homemall_pgdata_share:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: homemall-api-share
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-homemall}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost}
      COOKIE_NAME: ${COOKIE_NAME:-homemall_token}
    volumes:
      - homemall_uploads_share:/workspace/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_SERVER_URL: http://api:4000
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        COOKIE_NAME: ${COOKIE_NAME:-homemall_token}
    container_name: homemall-web-share
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      API_SERVER_URL: http://api:4000
      COOKIE_NAME: ${COOKIE_NAME:-homemall_token}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}

  gateway:
    image: caddy:2-alpine
    container_name: homemall-gateway-share
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  homemall_pgdata_share:
  homemall_uploads_share:
