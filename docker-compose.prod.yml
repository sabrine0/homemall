services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-homemall}
    volumes:
      - homemall_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-homemall}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-homemall}?schema=public}
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${APP_ORIGIN}
      COOKIE_NAME: ${COOKIE_NAME:-homemall_token}
      EXTERNAL_INGESTION_ENABLED: ${EXTERNAL_INGESTION_ENABLED:-false}
      EXTERNAL_INGESTION_INTERVAL_MINUTES: ${EXTERNAL_INGESTION_INTERVAL_MINUTES:-360}
      EXTERNAL_INGESTION_MAX_ROWS: ${EXTERNAL_INGESTION_MAX_ROWS:-120}
      EXTERNAL_INGESTION_DEACTIVATE_MISSING: ${EXTERNAL_INGESTION_DEACTIVATE_MISSING:-true}
    volumes:
      - homemall_uploads_prod:/workspace/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Migrations & Seed (run-once init container) ─────────────
  # Shares the same build as api — Docker/Coolify deduplicates the layers.
  # Excluded from Coolify health checks — exits after completion.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Running database migrations..."
        pnpm --filter @homemall/api prisma:deploy
        echo "Migrations complete."
        echo "Running database seed..."
        pnpm --filter @homemall/api prisma:seed
        echo "Seed complete."
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-homemall}?schema=public}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@homemall.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin12345!}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
    labels:
      - coolify.exclude_from_hc=true

  # ── Frontend Web (Coolify routes traffic here) ──────────────
  # Assign your domain to this service in Coolify's UI on port 3000.
  # Next.js rewrites proxy /api/* and /uploads/* to the api service
  # internally, so no separate reverse proxy is needed.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_SERVER_URL: http://api:4000
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        COOKIE_NAME: ${COOKIE_NAME:-homemall_token}
    restart: always
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      API_SERVER_URL: http://api:4000
      COOKIE_NAME: ${COOKIE_NAME:-homemall_token}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  homemall_pgdata_prod:
  homemall_uploads_prod:
